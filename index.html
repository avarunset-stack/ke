<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5457d6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KE">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>KE Mobile</title>
<style>
html,body{margin:0;height:100%;background:#f4f5f9;overflow:hidden}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f4f5f9}
#fb{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));text-align:center;font:14px system-ui,sans-serif;display:none;z-index:2}
#fb a{background:#5457d6;color:#fff;padding:10px 16px;border-radius:10px;text-decoration:none}
</style>
</head><body>
<!-- >>> Your Apps Script web app URL -->
<iframe id="app" allow="camera; clipboard-write; fullscreen"
  src="https://script.google.com/macros/s/AKfycbzii72bCTGyR_j_69eANKclU3wxHpGm-c6sb3RPDtZt4yni6RfsTh7lOLVUxfTlnLY8/exec?m=1"></iframe>
<div id="fb"><a id="fl" href="#" target="_top">Not loading? Open directly</a></div>
<script>
var f = document.getElementById('app');
document.getElementById('fl').href = f.src;
setTimeout(function () { document.getElementById('fb').style.display = 'block'; }, 9000);
f.addEventListener('load', function () { document.getElementById('fb').style.display = 'none'; });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body></html>
